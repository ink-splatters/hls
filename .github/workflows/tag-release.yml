name: Tag Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate release
    permissions:
      contents: read
      security-events: write # Upload zizmor SARIF results
    uses: $/.github/workflows/ci.yml

  build:
    name: Build (sdist + wheel)
    needs: [validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Build sdist + wheel
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*

  publish-github:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04

    permissions:
      contents: write # create and upload the release

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$RELEASE_TAG"
          --generate-notes
          --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    # TODO: Use a PyPI-sourced mpd-parser dependency before enabling PyPI publication.
    if: false
    needs: [build]
    runs-on: ubuntu-24.04

    environment:
      name: pypi
      url: https://pypi.org/p/stream-parser

    permissions:
      id-token: write # Trusted Publishing and PEP 740 attestations
      contents: read

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish to PyPI
        run: uv publish
