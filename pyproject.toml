[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stream-parser"
version = "0.5.0"
description = "HLS and DASH manifest utilities"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Peter A.", email = "ink.splatters@pm.me" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.3.0",
    "lxml>=6.1.0",
    "m3u8>=6.0.0",
    "mpd-parser @ git+https://github.com/ink-splatters/mpd-parser.git@v0.3.0-dev",
]

[dependency-groups]
dev = [
    "poethepoet>=0.37.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.4",
    "ty>=0.0.65",
    "types-lxml>=2026.2.16",
    "vulture>=2.16",
    "zizmor>=1.27.0",
]

[project.scripts]
hls = "stream_parser.hls.cli:main"
dash = "stream_parser.dash.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.poe.tasks]
vulture = "vulture src tests"
typecheck = "ty check src tests"
lint = ["ruff:check", "typecheck", "zizmor"]
check=["lint"]
fix = ["ruff:format", "ruff:fix", "typecheck", "zizmor:fix"]
test = "pytest"
zizmor = "zizmor -p ."

[tool.poe.tasks."zizmor:fix"]
cmd = "zizmor -p --fix=all ."

[tool.poe.tasks."ruff:format"]
cmd = "ruff format"

[tool.poe.tasks."ruff:check"]
cmd = "ruff check"

[tool.poe.tasks."ruff:fix"]
cmd = "ruff check --fix"

[tool.poe]
executor = { type = "uv" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=stream_parser",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests that may take longer to run",
    "mock: Tests that use mocking",
]

