[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hls"
version = "0.4.5"
description = "HLS playlist utils"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Peter A.", email = "ink.splatters@pm.me" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.3.0",
    "click-params>=0.5.0",
    "m3u8>=6.0.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.37.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.14.4",
    "ty>=0.0.65",
    "zizmor>=1.27.0",
]

[project.scripts]
hls = "hls.cli:hls"

[tool.poe.tasks]
typecheck = "ty check"
lint = ["ruff:check", "typecheck", "zizmor"]
check=["lint"]
fix = ["ruff:format", "ruff:fix", "typecheck", "zizmor"]
test = "pytest -q"
zizmor = "zizmor -p ."

[tool.poe.tasks."ruff:format"]
cmd = "ruff format"

[tool.poe.tasks."ruff:check"]
cmd = "ruff check"

[tool.poe.tasks."ruff:fix"]
cmd = "ruff check --fix"

[tool.poe]
executor = { type = "uv" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=hls",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests that may take longer to run",
    "mock: Tests that use mocking",
]

